<!DOCTYPE html>
<html>
<head>
    <title>Datasets</title>
</head>
<body>

<h1>My Datasets</h1>

<a href="{% url 'datasets:upload' %}">
    Upload New Dataset
</a>

<hr>

<ul>

{% for dataset in datasets %}

    <li>

        {{ dataset.name }}

        -

        {{ dataset.status }}

        -

        <a href="{% url 'datasets:profile' dataset.id %}">
            View Profile
        </a>

    </li>

{% empty %}

    <li>
        No datasets uploaded.
    </li>

{% endfor %}

</ul>

</body>
</html>
