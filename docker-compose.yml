services:

  web:
    build: .
    container_name: datadoctor-web

    command: python manage.py runserver 0.0.0.0:8000 #sh docker/entrypoint.sh

    volumes:
      - .:/app
      - media_data:/app/media

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db

  db:
    image: postgres:17

    container_name: datadoctor-db

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  media_data: