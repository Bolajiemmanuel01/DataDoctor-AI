<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DataDoctor AI{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Ih0bYg2w6kQ8c5Bp4zQ/5OdyGt+0UfZ0BOKR0lg2W7X+0QfUe5S5mTJUB5mF6TzN" crossorigin="anonymous">
    <style>
        body { padding-top: 60px; }
        .navbar-brand { font-weight: 700; }
        .card { margin-bottom: 1rem; }
        footer { padding: 1rem 0; text-align: center; color: #6c757d; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="/datasets/">DataDoctor AI</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/datasets/">Datasets</a></li>
        <li class="nav-item"><a class="nav-link" href="/cleaning/history/">Cleaning History</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container">{% block content %}{% endblock %}</main>

<footer>
    <div class="container">
        <small>POC DataDoctor AI • Simple dataset cleaning and profiling</small>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-HoA8E9YyKjbDzJr05w3Rz6+86ZLhA4Qo42ruE4cBzh2cxkJm1Fdk8zhKWVQLKQHB" crossorigin="anonymous"></script>
</body>
</html>
